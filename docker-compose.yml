version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: caelus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-caelus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caelus_password}
      POSTGRES_DB: ${DB_NAME:-caelus_cloud_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caelus_user} -d ${DB_NAME:-caelus_cloud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Redis Cache & Task Queue Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: caelus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # MinIO Object Storage (S3-Compatible untuk Dev / Staging)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: caelus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Backend API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.api
    container_name: caelus-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Background Worker Service
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.worker
    container_name: caelus-worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Frontend UI Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/Dockerfile.ui
    container_name: caelus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    depends_on:
      - api
    networks:
      - caelus-network

networks:
  caelus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
